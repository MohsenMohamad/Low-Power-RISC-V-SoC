# Bench demonstration against the Verilator simulation (PicoRV32 integration
# preview). The same list runs on a board with --board <profile>.
[run]
name = "sim-demo"

[[step]]
name   = "boot-rom-monitor-and-debug-ids"
action = "check_ids"

[[step]]
name   = "load-dbgapp"
action = "load"
image  = "build/fw_debug/lpsoc-picorv32-gcc/dbgapp.img"
start  = "reset"

[[step]]
name   = "driver-self-test"
action = "dbgrun"
test   = 2
seed   = 1

[[step]]
name   = "force-sleep"
action = "power"
state  = "sleep"
ticks  = 20000

[[step]]
name   = "force-dvfs-op2"
action = "dvfs"
op     = 2

[[step]]
name   = "force-deep-sleep-at-op2"
action = "power"
state  = "deep"
ticks  = 40000

[[step]]
name   = "force-dvfs-op0"
action = "dvfs"
op     = 0

[[step]]
name   = "force-idle"
action = "power"
state  = "idle"
ticks  = 3000

[[step]]
name   = "stress"
action = "dbgrun"
test   = 1
seed   = 20261105
iters  = 6

[[step]]
name   = "crash-illegal-instruction"
action = "dbgrun"
test   = 3
seed   = 1
expect = "crash"

[[step]]
name   = "final-debug-dump"
action = "dump"
